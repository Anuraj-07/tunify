<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tunify – Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar panel">
    <div class="logo"><span class="logo-dot"></span>Tunify</div>
    <nav class="nav">
      <button class="nav-btn active" id="navHome">Home</button>
      <button class="nav-btn" id="navSearch">Search</button>
    </nav>
    <h3 class="lib-title">Your Library</h3>
    <ul class="lib-list" id="playlistNav"></ul>
  </aside>

  <!-- Main content -->
  <main class="main panel">
    <header class="topbar">
      <input type="search" id="searchInput" placeholder="What do you want to play?" aria-label="Search songs">
    </header>

    <h1 class="greeting" id="greeting">Good evening</h1>
    <div class="cards" id="cards"></div>

    <div class="list-head">
      <button class="play-all" id="playAll" aria-label="Play all">▶</button>
      <h2 id="listTitle">All Songs</h2>
    </div>
    <ul class="tracks" id="trackList"></ul>
    <p class="empty" id="emptyMsg" hidden>No songs found.</p>
  </main>

  <!-- Player bar -->
  <footer class="player">
    <div class="np">
      <div class="np-cover" id="npCover"></div>
      <div class="np-text">
        <p class="np-title" id="npTitle">Pick a song</p>
        <p class="np-artist" id="npArtist">Tunify</p>
      </div>
      <button class="icon-btn" id="npLike" aria-label="Like song">♡</button>
    </div>

    <div class="controls">
      <div class="ctrl-row">
        <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">⇄</button>
        <button class="icon-btn" id="prevBtn" aria-label="Previous">⏮</button>
        <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
        <button class="icon-btn" id="nextBtn" aria-label="Next">⏭</button>
        <button class="icon-btn" id="repeatBtn" aria-label="Repeat" title="Repeat: off">↻</button>
      </div>
      <div class="seek-row">
        <span id="curTime">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="vol">
      <span aria-hidden="true">🔊</span>
      <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
